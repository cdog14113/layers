<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:#eee;font:12px -apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app,#cut{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:#000}
#cut{display:none;z-index:10}
.bar{display:flex;align-items:stretch;background:#1c1c1e;border-bottom:1px solid #2c2c2e;min-height:52px}

.bar .sp{flex:1}
.ib{font-size:10px;flex:1;background:none;border:0;color:#e5e5ea;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;min-width:0;position:relative}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:#3a3a3c}.ib.on{background:#ff3bd4;color:#fff}.ib:disabled{opacity:.3}
label.ib{cursor:pointer}
input[type=file]{display:none}
#stage{flex:1;position:relative;min-height:0;background:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%3E%3Crect%20width=%2716%27%20height=%2716%27%20fill=%27%233a3a3c%27/%3E%3Crect%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3Crect%20x=%278%27%20y=%278%27%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3C/svg%3E) 0 0/16px 16px;touch-action:none;overflow:hidden}
#cv{position:absolute;touch-action:none;outline:1px solid rgba(255,255,255,.3)}

.th{position:relative;width:52px;height:52px;margin:3px 0;border:2px solid transparent;border-radius:4px;background:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%3E%3Crect%20width=%2716%27%20height=%2716%27%20fill=%27%233a3a3c%27/%3E%3Crect%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3Crect%20x=%278%27%20y=%278%27%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3C/svg%3E) 0 0/16px 16px}
.th canvas{width:100%;height:100%;display:block}
.th.sel{border-color:#ff3bd4}
.th.hid canvas{opacity:.25}
.th .mv{position:absolute;right:-1px;top:-1px;bottom:-1px;width:18px;display:flex;flex-direction:column;justify-content:space-between}
.th .mv b{background:rgba(255,59,212,.9);color:#fff;font-size:11px;text-align:center;line-height:20px;height:20px;border-radius:3px;font-weight:700}
.th .eye{position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 3px;border-radius:3px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8e8e93;text-align:center;padding:30px 30px 30px 80px;pointer-events:none;font-size:14px}

.row{display:flex;gap:8px;align-items:center;margin:4px 0}.row label{width:72px;color:#aaa}.row input[type=range]{flex:1}

.row button{padding:7px 10px;border:1px solid #48484a;border-radius:6px;background:#2c2c2e;color:#eee;font:inherit}.row button.on{background:#ff3bd4;color:#fff;border-color:#ff3bd4}
#cut{background:#000}

#cc{flex:1;min-height:0;position:relative;touch-action:none;background:url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2716%27%20height=%2716%27%3E%3Crect%20width=%2716%27%20height=%2716%27%20fill=%27%233a3a3c%27/%3E%3Crect%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3Crect%20x=%278%27%20y=%278%27%20width=%278%27%20height=%278%27%20fill=%27%232a2a2c%27/%3E%3C/svg%3E) 0 0/16px 16px}

#bgsw{width:38px;height:38px;border:2px solid #2f86f6;border-radius:8px;padding:0;flex:none}

#cut .cbg{background:#1c1c1e}

#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 14px;border-radius:8px;z-index:30;display:none;max-width:80%;text-align:center}

/* Photo Layers-style floating adjustment controls */
#stage{overflow:hidden}#sheet.effects{position:absolute;left:0;right:0;bottom:calc(53px + env(safe-area-inset-bottom));z-index:5;border:0;background:rgba(0,0,0,.72);padding:3px 7px 0}

#sheet.effects input[type=range]{appearance:none;-webkit-appearance:none;min-width:0;height:6px;border-radius:9px;background:linear-gradient(to right,#079bff 0 var(--fill),#303030 var(--fill) 100%);margin:0;outline:none}
#sheet.effects input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:37px;height:24px;border:0;border-radius:18px;background:#f7f7f7;box-shadow:0 0 1px #ddd}
#sheet.effects input[type=range]::-moz-range-thumb{width:37px;height:24px;border:0;border-radius:18px;background:#f7f7f7}
#sheet.effects button.reset{border:1.5px solid #eee;border-radius:50%;width:18px;height:18px;min-width:18px;padding:0;background:none;color:#eee;font:22px/13px Arial;display:flex;align-items:center;justify-content:center;margin:0 4px 0 1px}
#sheet.effects.shadow .row{height:51px}#sheet.effects.shadow label{font-size:11px}
.swatches{display:flex;gap:7px;justify-content:space-between;height:49px;align-items:flex-start;padding:3px 0 6px}
.swatches button{flex:1;min-width:0;height:38px;border-radius:6px;border:1px solid #888;padding:0;position:relative}
.swatches button.selected{outline:2px solid #079bff;outline-offset:1px}
.swatches .transparent{background-color:#fff!important;background-image:conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0)!important;background-size:12px 12px!important}
#bot{height:53px;background:#272727;flex:none}#bot .ib{font-size:0;color:#3498dc;padding:5px 0;gap:0}#bot .ib svg{width:28px;height:28px;stroke-width:1.4}#bot .ib.on{background:#079bff;color:white;box-shadow:inset 0 0 0 2px #299fff}#bot #bRemove{color:#ef5a64}
@media(max-width:360px){#sheet.effects label{width:79px;font-size:12px}#sheet.effects .row{gap:7px}#sheet.effects.shadow label{font-size:10px}}

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const MAXL=11,MAXD=1600;
let W=1080,H=1080,layers=[],sel=null,uid=1,view={s:1};
let bg='#ffffff',bgTransparent=true,autoSize=false,sheetMode=null;
const undoS=[],redoS=[];
const store=new Map();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function cloneC(c){const n=mkC(c.width,c.height);n.getContext('2d').drawImage(c,0,0);return n}
function cur(){return layers.find(l=>l.id===sel)}
function newLayer(img,name){
  const k=Math.min(1,MAXD/Math.max(img.width,img.height));
  const c=mkC(Math.round(img.width*k),Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const l={id:uid++,name,src:c,orig:cloneC(c),x:W/2,y:H/2,sx:1,sy:1,r:0,flipX:false,vis:true,br:0,ct:1,sat:1,hue:0,op:1,feather:0,warmth:0,tint:0,blur:0,shadow:0,shColor:'#000000',shBlur:20,shX:0,shY:0};
  fitLayer(l);store.set(l.id,{orig:l.orig});return l;
}
function fitLayer(l){const k=Math.min(W/l.src.width,H/l.src.height);l.sx=l.sy=k;l.x=W/2;l.y=H/2;l.r=0}
// Separable, premultiplied pixel blur. No CanvasRenderingContext2D.filter.
function boxPass(src,w,h,r,horizontal){
  const out=new Float32Array(src.length),major=horizontal?h:w,n=horizontal?w:h,step=horizontal?4:w*4;
  for(let j=0;j<major;j++){const base=horizontal?j*w*4:j*4;const sums=[0,0,0,0];
    for(let k=-r;k<=r;k++){const q=base+Math.max(0,Math.min(n-1,k))*step;for(let c=0;c<4;c++)sums[c]+=src[q+c]}
    for(let i=0;i<n;i++){const q=base+i*step;for(let c=0;c<4;c++)out[q+c]=sums[c]/(2*r+1);
      const rm=base+Math.max(0,i-r)*step,ad=base+Math.min(n-1,i+r+1)*step;for(let c=0;c<4;c++)sums[c]+=src[ad+c]-src[rm+c]}
  }return out;
}
function pixelBlur(id,r){
  r=Math.round(r);if(r<1)return id;const d=id.data,w=id.width,h=id.height;let f=new Float32Array(d.length);
  for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;f[i]=d[i]*a;f[i+1]=d[i+1]*a;f[i+2]=d[i+2]*a;f[i+3]=d[i+3]}
  r=Math.max(1,Math.round(r/1.7));for(let p=0;p<3;p++){f=boxPass(f,w,h,r,true);f=boxPass(f,w,h,r,false)}
  for(let i=0;i<d.length;i+=4){const a=f[i+3];d[i]=a?f[i]*255/a:0;d[i+1]=a?f[i+1]*255/a:0;d[i+2]=a?f[i+2]*255/a:0;d[i+3]=a}return id;
}
function adjusted(l){
  const key=[l.br,l.ct,l.sat,l.hue,l.warmth,l.tint,l.feather,l.blur].join('|');
  if(l._cs===l.src&&l._ck===key)return l._cc;
  const w=l.src.width,h=l.src.height,cc=mkC(w,h),c=cc.getContext('2d');let id=l.src.getContext('2d').getImageData(0,0,w,h),d=id.data;
  const b=1+l.br,ct=l.ct,sat=l.sat,wa=(l.warmth||0)*55,ti=(l.tint||0)*45;
  for(let i=0;i<d.length;i+=4){let r=(d[i]*b-127.5)*ct+127.5,g=(d[i+1]*b-127.5)*ct+127.5,bl=(d[i+2]*b-127.5)*ct+127.5;
    const y=.213*r+.715*g+.072*bl;d[i]=y+(r-y)*sat+wa+ti*.5;d[i+1]=y+(g-y)*sat-ti;d[i+2]=y+(bl-y)*sat-wa+ti*.5;
  }
  if(l.feather){
    const dist=new Float32Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const q=y*w+x;dist[q]=d[q*4+3]<8?0:Math.min(x+1,y+1,w-x,h-y)}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const q=y*w+x;if(x)dist[q]=Math.min(dist[q],dist[q-1]+1);if(y)dist[q]=Math.min(dist[q],dist[q-w]+1)}
    for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const q=y*w+x;if(x<w-1)dist[q]=Math.min(dist[q],dist[q+1]+1);if(y<h-1)dist[q]=Math.min(dist[q],dist[q+w]+1);const t=Math.min(1,dist[q]/(l.feather+1));d[q*4+3]*=t*t*(3-2*t)}
  }
  if(l.blur>0)pixelBlur(id,l.blur);
  else if(l.blur<0){const blurred=new ImageData(new Uint8ClampedArray(d),w,h);pixelBlur(blurred,2);const k=-l.blur/15;for(let i=0;i<d.length;i+=4)for(let j=0;j<3;j++)d[i+j]+=k*(d[i+j]-blurred.data[i+j])}
  c.putImageData(id,0,0);l._cc=cc;l._cs=l.src;l._ck=key;return cc;
}
function shadowImage(l,img){
  const key=[l._ck,l.shColor,l.shBlur].join('|');if(l._shadowSrc===img&&l._shadowKey===key)return l._shadowCanvas;
  const pad=Math.ceil(l.shBlur*2+2),w=img.width+pad*2,h=img.height+pad*2,c=mkC(w,h),x=c.getContext('2d');
  x.drawImage(img,pad,pad);let id=x.getImageData(0,0,w,h),d=id.data;const hex=l.shColor||'#000000',rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));
  for(let i=0;i<d.length;i+=4){d[i]=rgb[0];d[i+1]=rgb[1];d[i+2]=rgb[2]}pixelBlur(id,l.shBlur);x.putImageData(id,0,0);
  l._shadowSrc=img;l._shadowKey=key;l._shadowCanvas=c;l._shadowPad=pad;return c;
}
function drawLayer(c,l){
