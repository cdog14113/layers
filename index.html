<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#fff;color:#222;font:12px -apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#app,#cut{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);background:#fff}
#cut{display:none;z-index:10}
.bar{display:flex;align-items:stretch;background:#f7f7f7;border-bottom:1px solid #ddd;min-height:52px}

.bar .sp{flex:1}
.ib{font-size:10px;flex:1;background:none;border:0;color:#333;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;min-width:0;position:relative}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:#e6e6e6}.ib.on{background:#ff3bd4;color:#fff}.ib:disabled{opacity:.3}
label.ib{cursor:pointer}
input[type=file]{display:none}
#stage{flex:1;position:relative;min-height:0;background:#e9e9e9;touch-action:none;overflow:hidden}
#cv{position:absolute;touch-action:none}
#strip{position:absolute;left:0;top:0;bottom:0;width:58px;overflow:auto;background:rgba(240,240,240,.75);z-index:3;padding:2px}
.th{position:relative;width:52px;height:52px;margin:3px 0;border:2px solid transparent;border-radius:4px;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px}
.th canvas{width:100%;height:100%;display:block}
.th.sel{border-color:#ff3bd4}
.th.hid canvas{opacity:.25}
.th .mv{position:absolute;right:-1px;top:-1px;bottom:-1px;width:18px;display:flex;flex-direction:column;justify-content:space-between}
.th .mv b{background:rgba(255,59,212,.9);color:#fff;font-size:11px;text-align:center;line-height:20px;height:20px;border-radius:3px;font-weight:700}
.th .eye{position:absolute;left:2px;bottom:2px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 3px;border-radius:3px}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;text-align:center;padding:30px 30px 30px 80px;pointer-events:none;font-size:14px}
#sheet{display:none;background:#f7f7f7;border-top:1px solid #ddd;padding:6px 10px}
#sheet.show{display:block}
.row{display:flex;gap:8px;align-items:center;margin:4px 0}.row label{width:72px;color:#555}.row input[type=range]{flex:1}
.row select{flex:1;padding:6px;border-radius:6px;border:1px solid #ccc;background:#fff;font:inherit}
.row input[type=color]{width:44px;height:30px;border:0;background:none;padding:0}
.row button{padding:7px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;font:inherit}.row button.on{background:#ff3bd4;color:#fff;border-color:#ff3bd4}
#cutTop{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f7f7f7;border-bottom:1px solid #ddd}
#cutTop .ttl{font-size:16px;font-weight:600}
#cutTop .off{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#555}
#cutTop .off input{width:100%}
#cutTop button{border:0;background:none;font:inherit;font-weight:600;color:#0a60ff;padding:8px}
#cc{flex:1;min-height:0;position:relative;touch-action:none;background:#888}
#cc canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#cutCtl{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#f7f7f7;border-top:1px solid #ddd;font-size:11px;color:#444}
#cutCtl .sl{flex:1;display:flex;flex-direction:column;align-items:center}#cutCtl .sl input{width:100%}
#cutCtl button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:7px 9px;font:inherit}
#bgsw{width:34px;height:34px;border:1px solid #888;border-radius:4px;padding:0}
#smooth{display:none;background:#f7f7f7;padding:6px;border-top:1px solid #ddd;align-items:center;gap:6px}
#smooth button{flex:1;padding:10px 0;border:1px solid #ccc;border-radius:6px;background:#fff;font:inherit}#smooth button.on{background:#ff3bd4;color:#fff}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 14px;border-radius:8px;z-index:30;display:none;max-width:80%;text-align:center}
</style></head><body>
<div id="app">
 <div class="bar" id="top">
  <button class="ib" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>New</button>
  <button class="ib" id="bgBtn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>Background</button>
  <label class="ib"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg>Add<input id="file" type="file" accept="image/*" multiple></label>
  <button class="ib" id="undo"><svg viewBox="0 0 24 24"><path d="M9 8L4 13l5 5M4 13h10a6 6 0 010 0 6 6 0 016 6"/></svg>Undo</button>

 <div class="bar bot" id="bot">

 <div id="cutTop"><button id="cutBack">Cancel</button><span class="ttl">Eraser</span>

 <div id="smooth"><span style="width:70px">Smooth Edge</span><button data-n="0">0</button><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button></div>

 </div>
 <div class="bar bot" id="cutTabs">

  <button class="ib on" data-m="manual"><svg viewBox="0 0 24 24"><path d="M4 15L14 5l5 5-10 10H4z"/></svg>Manual</button>
  <button class="ib" data-m="repair"><svg viewBox="0 0 24 24"><path d="M18 3l3 3-9 9-4 1 1-4zM7 17c-2 0-3 2-3 4 3 0 5-1 5-3"/></svg>Repair</button>
  <button class="ib" data-m="smooth"><svg viewBox="0 0 24 24"><path d="M3 15c3-8 6-8 9 0s6 8 9 0"/></svg>Smooth</button>
  <button class="ib" data-m="zoom"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M10 7v6M7 10h6"/></svg>Zoom</button>
 </div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const MAXL=11,MAXD=1600;
let W=1080,H=1080,layers=[],sel=null,uid=1,view={s:1};
let bg='#ffffff',bgTransparent=true,autoSize=true,sheetMode=null;
const undoS=[],redoS=[];
const store=new Map();
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function cloneC(c){const n=mkC(c.width,c.height);n.getContext('2d').drawImage(c,0,0);return n}
function cur(){return layers.find(l=>l.id===sel)}
function newLayer(img,name){
  const k=Math.min(1,MAXD/Math.max(img.width,img.height));
  const c=mkC(Math.round(img.width*k),Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const l={id:uid++,name,src:c,orig:cloneC(c),x:W/2,y:H/2,sx:1,sy:1,r:0,flipX:false,vis:true,br:0,ct:1,sat:1,hue:0,op:1,shadow:0,shBlur:20,shDist:12};
  fitLayer(l);store.set(l.id,{orig:l.orig});return l;
}
function fitLayer(l){const k=Math.min(W/l.src.width,H/l.src.height);l.sx=l.sy=k;l.x=W/2;l.y=H/2;l.r=0}
function filterStr(l){const f=[];if(l.br)f.push(`brightness(${1+l.br})`);if(l.ct!==1)f.push(`contrast(${l.ct})`);if(l.sat!==1)f.push(`saturate(${l.sat})`);if(l.hue)f.push(`hue-rotate(${l.hue}deg)`);return f.join(' ')||'none'}
function drawLayer(c,l){
  if(!l.vis)return;
  c.save();c.globalAlpha=l.op;c.translate(l.x,l.y);c.rotate(l.r);c.scale(l.sx*(l.flipX?-1:1),l.sy);
  if(l.shadow){c.shadowColor='rgba(0,0,0,.65)';c.shadowBlur=l.shBlur*Math.max(l.sx,l.sy);c.shadowOffsetX=l.shDist*l.sx*(l.flipX?-1:1)*.0;c.shadowOffsetY=l.shDist*l.sy}
  const f=filterStr(l);if(f!=='none')c.filter=f;
  c.drawImage(l.src,-l.src.width/2,-l.src.height/2);c.restore();
}
function checker(c,w,h,t){for(let y=0;y<h;y+=t)for(let x=0;x<w;x+=t){c.fillStyle=((x/t+y/t)&1)?'#cfcfcf':'#fff';c.fillRect(x,y,t,t)}}
function render(c,forExport){
  c.clearRect(0,0,W,H);
  if(!bgTransparent){c.fillStyle=bg;c.fillRect(0,0,W,H)}else if(!forExport)checker(c,W,H,Math.max(16,W/45));
  for(const l of layers)drawLayer(c,l);
}
/* handles */
function handles(l){
  const w=l.src.width*l.sx/2,h=l.src.height*l.sy/2,c=Math.cos(l.r),s=Math.sin(l.r);
  const P=(x,y)=>({x:l.x+x*c-y*s,y:l.y+x*s+y*c});
  return {tl:P(-w,-h),tr:P(w,-h),br:P(w,h),bl:P(-w,h),rm:P(w,0),bm:P(0,h)};
}
function draw(){
  render(ctx,false);const l=cur();
  if(l&&l.vis){
    const h=handles(l),k=1/view.s;ctx.save();ctx.lineWidth=2*k;ctx.strokeStyle='#ff3bd4';
    ctx.beginPath();ctx.moveTo(h.tl.x,h.tl.y);ctx.lineTo(h.tr.x,h.tr.y);ctx.lineTo(h.br.x,h.br.y);ctx.lineTo(h.bl.x,h.bl.y);ctx.closePath();ctx.stroke();
    ctx.fillStyle='#fff';
    const dot=(p,r)=>{ctx.beginPath();ctx.arc(p.x,p.y,r*k,0,7);ctx.fill();ctx.stroke()};
    dot(h.tl,11);dot(h.br,11);dot(h.rm,9);dot(h.bm,9);
    // icons
    ctx.fillStyle='#ff3bd4';ctx.font=`bold ${12*k}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('↻',h.tl.x,h.tl.y);ctx.fillText('⤡',h.br.x,h.br.y);ctx.fillText('↔',h.rm.x,h.rm.y);ctx.fillText('↕',h.bm.x,h.bm.y);
    ctx.restore();
  }
}
function fitView(){
  const r=stage.getBoundingClientRect();const left=58;
  const s=Math.min((r.width-left-12)/W,(r.height-12)/H);
  cv.width=W;cv.height=H;cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.style.left=left+(r.width-left-W*s)/2+'px';cv.style.top=(r.height-H*s)/2+'px';view.s=s;
}
function toCanvas(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hit(l,p){
  const w=l.src.width,h=l.src.height,dx=p.x-l.x,dy=p.y-l.y,c=Math.cos(-l.r),s=Math.sin(-l.r);
  const lx=(dx*c-dy*s)/l.sx*(l.flipX?-1:1),ly=(dx*s+dy*c)/l.sy;
  if(Math.abs(lx)>w/2||Math.abs(ly)>h/2)return false;
  try{return l.src.getContext('2d').getImageData(Math.floor(lx+w/2),Math.floor(ly+h/2),1,1).data[3]>20}catch(e){return true}
}
/* undo (props snapshot; pixel changes carry cloned canvases) */
function snap(){return JSON.stringify({W,H,bg,bgTransparent,autoSize,sel,layers:layers.map(l=>{const o={...l};delete o.src;delete o.orig;return o})})}
const srcMap=new Map(); // id -> current src canvas (so removed layers can come back)
function pushUndo(imgs){layers.forEach(l=>srcMap.set(l.id,l.src));undoS.push({state:snap(),imgs:imgs||null,srcs:Object.fromEntries(layers.map(l=>[l.id,l.src]))});if(undoS.length>40)undoS.shift();redoS.length=0;updUndo()}
function restore(st){
  const o=JSON.parse(st.state);W=o.W;H=o.H;bg=o.bg;bgTransparent=o.bgTransparent;autoSize=o.autoSize;sel=o.sel;
  layers=o.layers.map(l=>{l.src=(st.imgs&&st.imgs[l.id])||st.srcs[l.id]||srcMap.get(l.id);l.orig=store.get(l.id).orig;return l});
  fitView();refresh();
}
function nowEntry(from){ // entry capturing present state for redo/undo opposite
  const e={state:snap(),imgs:null,srcs:Object.fromEntries(layers.map(l=>[l.id,l.src]))};
  if(from.imgs){e.imgs={};for(const id in from.imgs){const l=layers.find(x=>x.id==id);if(l)e.imgs[id]=cloneC(l.src)}}
  return e;
}
function undo(){if(!undoS.length)return;const st=undoS.pop();redoS.push(nowEntry(st));restore(st);updUndo()}
function redo(){if(!redoS.length)return;const st=redoS.pop();undoS.push(nowEntry(st));restore(st);updUndo()}
function updUndo(){$('undo').disabled=!undoS.length;$('redo').disabled=!redoS.length}
$('undo').onclick=undo;$('redo').onclick=redo;

/* gestures on main canvas */
const ptrs=new Map();let g=null;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('#strip'))return;
  stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);
  const p=toCanvas(e),l=cur();
  if(ptrs.size===1){
    if(l&&l.vis){ // handles
      const h=handles(l),tol=26/view.s,d=(a)=>Math.hypot(a.x-p.x,a.y-p.y);
      const w=l.src.width,hh=l.src.height;
      let which=null;
      if(d(h.tl)<tol)which='rot';else if(d(h.br)<tol)which='sc';else if(d(h.rm)<tol)which='w';else if(d(h.bm)<tol)which='h';
      if(which){pushUndo();g={l,h:which,sx:l.sx,sy:l.sy,r:l.r,ang0:Math.atan2(p.y-l.y,p.x-l.x)-l.r,d0:Math.hypot(p.x-l.x,p.y-l.y)};return}
    }
    let t=null;
    if(l&&l.vis&&hit(l,p))t=l;else for(let i=layers.length-1;i>=0;i--){if(layers[i].vis&&hit(layers[i],p)){t=layers[i];break}}
    if(t){sel=t.id;refresh();pushUndo();g={l:t,x:p.x,y:p.y,lx:t.x,ly:t.y}}else{sel=null;refresh()}
  }else if(ptrs.size===2&&cur()){
    const [a,b]=[...ptrs.values()],l=cur();if(!g)pushUndo();
    g={l,pinch:true,d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),a:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),sx:l.sx,sy:l.sy,r:l.r,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2,lx:l.x,ly:l.y};
  }
});
stage.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!g)return;ptrs.set(e.pointerId,e);const l=g.l;
  if(g.pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),an=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),k=d/g.d;
    l.sx=g.sx*k;l.sy=g.sy*k;l.r=g.r+(an-g.a);
    l.x=g.lx+((a.clientX+b.clientX)/2-g.cx)/view.s;l.y=g.ly+((a.clientY+b.clientY)/2-g.cy)/view.s;
  }else if(g.h){
    const p=toCanvas(e),dx=p.x-l.x,dy=p.y-l.y,c=Math.cos(-l.r),s=Math.sin(-l.r),lx=dx*c-dy*s,ly=dx*s+dy*c,w=l.src.width/2,h=l.src.height/2;
    if(g.h==='rot')l.r=Math.atan2(dy,dx)-g.ang0;
    else if(g.h==='sc'){const k=Math.hypot(dx,dy)/g.d0;l.sx=g.sx*k;l.sy=g.sy*k}
    else if(g.h==='w')l.sx=Math.max(.02,Math.abs(lx)/w);
    else if(g.h==='h')l.sy=Math.max(.02,Math.abs(ly)/h);
  }else if(!g.pinch){const p=toCanvas(e);l.x=g.lx+p.x-g.x;l.y=g.ly+p.y-g.y}
  draw();
});
function endP(e){ptrs.delete(e.pointerId);if(!ptrs.size)g=null;else if(g&&g.pinch&&ptrs.size===1){const l=g.l,p=toCanvas([...ptrs.values()][0]);g={l,x:p.x,y:p.y,lx:l.x,ly:l.y}}}
stage.addEventListener('pointerup',endP);stage.addEventListener('pointercancel',endP);

/* UI */
function refresh(){draw();renderStrip();$('empty').style.display=layers.length?'none':'flex';updUndo();$('bot').style.opacity=cur()?1:.5;if(sheetMode)renderSheet()}
function renderStrip(){
  const s=$('strip');s.innerHTML='';
  [...layers].reverse().forEach(l=>{
    const d=document.createElement('div');d.className='th'+(l.id===sel?' sel':'')+(l.vis?'':' hid');
    const t=mkC(104,104),tc=t.getContext('2d'),k=Math.min(104/l.src.width,104/l.src.height);
    tc.drawImage(l.src,(104-l.src.width*k)/2,(104-l.src.height*k)/2,l.src.width*k,l.src.height*k);d.appendChild(t);
    const eye=document.createElement('div');eye.className='eye';eye.textContent=l.vis?'👁':'—';eye.onclick=ev=>{ev.stopPropagation();pushUndo();l.vis=!l.vis;refresh()};d.appendChild(eye);
    if(l.id===sel){const m=document.createElement('div');m.className='mv';
      const u=document.createElement('b');u.textContent='▲';u.onclick=ev=>{ev.stopPropagation();mv(l,1)};
      const dn=document.createElement('b');dn.textContent='▼';dn.onclick=ev=>{ev.stopPropagation();mv(l,-1)};m.append(u,dn);d.appendChild(m)}
    d.onclick=()=>{sel=l.id;refresh()};s.appendChild(d);
  });
}

async function loadImg(f){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url}).catch(()=>null);URL.revokeObjectURL(url);return img}

const cc=$('cc'),ccv=$('ccv'),cx=ccv.getContext('2d');

$('cundo').onclick=()=>{if(!E||!E.stack.length)return;const c=E.work.getContext('2d');E.redo.push(c.getImageData(0,0,E.work.width,E.work.height));c.putImageData(E.stack.pop(),0,0);updE();ccDraw()};

function setCM(m){

document.querySelectorAll('#cutTabs [data-m]').forEach(b=>b.onclick=()=>E&&setCM(b.dataset.m));

$('bgsw').onclick=()=>{cm.bgIdx=(cm.bgIdx+1)%BGS.length;const b=BGS[cm.bgIdx];$('bgsw').style.background=b==='checker'?'repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px':b;ccDraw()};
$('bgsw').style.background='repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px';
document.querySelectorAll('#smooth button').forEach(b=>b.onclick=()=>{
  const n=+b.dataset.n;document.querySelectorAll('#smooth button').forEach(x=>x.classList.toggle('on',x===b));
  if(!E.smPushed){const c=E.smBase.getContext('2d');E.stack.push(c.getImageData(0,0,c.canvas.width,c.canvas.height));E.redo.length=0;E.smPushed=true;updE()}

function imgPt(p){return {x:(p.x-E.ox)/E.z,y:(p.y-E.oy)/E.z}}
function ccPos(e){const r=cc.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
function brushAt(a,b){
  const c=E.work.getContext('2d'),A=imgPt(a),B=imgPt(b),rad=cm.size/2/E.z,dist=Math.hypot(B.x-A.x,B.y-A.y),n=Math.max(1,Math.ceil(dist/Math.max(.5,rad/4)));

function colDist(d,i,r,g,b){const dr=d[i]-r,dg=d[i+1]-g,db=d[i+2]-b;return Math.sqrt(dr*dr+dg*dg+db*db)}
function fillErase(sx,sy,tol,maxR,cx0,cy0){ // contiguous region similar to seed color (optionally limited to circle)

    d[i+3]=0;
    if(px>0&&!seen[p-1]){seen[p-1]=1;st.push(p-1)}if(px<bw-1&&!seen[p+1]){seen[p+1]=1;st.push(p+1)}
    if(py>0&&!seen[p-bw]){seen[p-bw]=1;st.push(p-bw)}if(py<bh-1&&!seen[p+bw]){seen[p+bw]=1;st.push(p+bw)}}

function magicAt(x,y,rad){fillErase(x,y,38,rad,x,y)}
function colorAt(p){const q=imgPt(p),c=E.work.getContext('2d');
  const tol=(cm.thr||25)*2.2;fillErase(q.x,q.y,tol,0,0,0)}
cc.addEventListener('pointerdown',e=>{
  if(!E)return;cc.setPointerCapture(e.pointerId);E.pts.set(e.pointerId,ccPos(e));

cc.addEventListener('pointermove',e=>{

function ccEnd(e){

  }

cc.addEventListener('pointerup',ccEnd);cc.addEventListener('pointercancel',ccEnd);
window.addEventListener('resize',()=>{if(E){sizeCC();ccDraw()}});
function closeCut(){$('cut').style.display='none';E=null;fitView();draw()}
$('cutBack').onclick=()=>{if(!E)return;E.l.src=E.before;E.l.src===E.before;closeCut();refresh()};

$('bCut').onclick=()=>cur()&&openCut();
